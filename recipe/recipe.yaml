schema_version: 1

context:
  name: mjlab
  version: "1.5.0"
  build_number: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/mujocolab/mjlab/archive/refs/tags/v${{ version }}.zip
  sha256: 7ac44e194924d44561202118dd5f0adcf55ec9afdc50d75a46f1649767f62804

build:
  number: ${{ build_number }}
  script:
    - if: not linux
      then:
        - sed -i '' "s/\"torchrunx\([^\"]*\)\"/\"torchrunx\1; sys_platform == 'linux'\"/" pyproject.toml
        - cat pyproject.toml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build
  run:
    - python >=${{ python_min }}
    - prettytable
    - tqdm
    - tyro >=1.0.1
    - pytorch >=2.7.0
    - if: linux
      then:
        - __linux
        - torchrunx >=0.3.4
    - warp-lang >=1.14.0
    - mujoco-warp >=3.10.0.1,<3.11
    - mujoco >=3.10.0,<3.11
    - trimesh >=4.8.3
    - scipy >=1.15
    - viser >=1.0.27
    - mjviser >=0.0.14
    - mediapy >=1.2.6
    - numpy <2.5
    - imageio-ffmpeg
    - tensordict
    - rsl-rl-lib ==5.4.0
    - tensorboard >=2.20.0
    - onnxscript >=0.5.4
    - wandb >=0.22.3
    # Needed by mediapy in __init__.py
    - ffmpeg
  run_constraints:
    - if: not linux
      then:
        - __linux ==0.0.0

tests:
  - python:
      imports:
        - mjlab
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - pytest tests/
        --deselect "tests/test_tyro_flags.py::test_tyro_cli_calls_have_tyro_flags"
        --deselect="tests/test_viewer_tick.py::test_no_spiral"
    files:
      source:
        - pyproject.toml
        - src/mjlab/asset_zoo
        - tests/
    requirements:
      run:
        - pytest
        - python ${{ python_min }}.*
        - scipy

about:
  homepage: https://mujocolab.github.io/mjlab/
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/mujocolab/mjlab
  summary: Isaac Lab API, powered by MuJoCo-Warp, for RL and robotics research.

extra:
  recipe-maintainers:
    - kevinzakka
    - diegoferigo
